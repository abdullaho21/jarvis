name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kws-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      # No inference libraries, audio or models are downloaded for this probe.
      - run: cargo +stable test --manifest-path native/kws-probe/Cargo.toml --locked
      - run: cargo +stable build --release --manifest-path native/kws-probe/Cargo.toml --locked
      - run: python3 -m unittest tests.test_kws_probe -v

  windows-policy:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[windows]'
      - run: python -m compileall -q src scripts
      - run: python -m unittest tests.test_windows -v
      - run: python -m unittest tests.test_process_memory -v
      - run: python -m unittest tests.test_voice_upgrade.FakeVoskEngineTests -v
      - run: rustup toolchain install stable --profile minimal
      - run: python scripts/build_replay_store.py --test
        env:
          RUSTUP_TOOLCHAIN: stable
      - run: python -m unittest tests.test_replay_store -v

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m compileall -q src scripts
      # Optional upstream audio is deliberately not downloaded by unit tests.
      - run: python -m unittest discover -s tests -v

  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[voice]'
      - run: rustup toolchain install stable --profile minimal
      - run: python scripts/build_voice_worker.py --test
        env:
          RUSTUP_TOOLCHAIN: stable
      - run: python -m unittest discover -s tests -v

  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -e .
      - run: rustup toolchain install stable --profile minimal
      - run: python scripts/build_controller.py --test
        env:
          RUSTUP_TOOLCHAIN: stable
      - run: python scripts/build_cli.py --test
        env:
          RUSTUP_TOOLCHAIN: stable
      - run: python scripts/build_replay_store.py --test
        env:
          RUSTUP_TOOLCHAIN: stable
      - run: python -m unittest tests.test_replay_store -v
      - run: python -m unittest tests.test_rust_controller tests.test_rust_cli -v

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install 'build>=1,<2'
      - run: python -m build
