[package]
name = "jarvis-controller"
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "Native, event-driven Jarvis controller with the existing local JSON API"

[dependencies]
jarvis-phrases = { path = "../command-phrases" }
jarvis-replay-store = { path = "../replay-store" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "=1.54.1", features = ["rt", "macros", "net", "io-util", "process", "signal", "sync", "time"] }
unicode-casefold = "0.2"
regex = "1"
shlex = "1"

[profile.release]
lto = "thin"
strip = "debuginfo"
