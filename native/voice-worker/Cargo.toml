[package]
name = "jarvis-voice"
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "CPU-only Vosk/Whisper/GTCRN voice worker for Jarvis"

[dependencies]
jarvis-phrases = { path = "../command-phrases" }
jarvis-gtcrn = { path = "../gtcrn-denoiser" }
jarvis-whisper = { path = "../whisper-recognizer" }
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = false
codegen-units = 16
strip = "debuginfo"
