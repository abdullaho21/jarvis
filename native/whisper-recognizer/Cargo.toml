[package]
name = "jarvis-whisper"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "Whisper command recognition using Rust feature extraction and neural inference"

[dependencies]
tract-onnx = { version = "=0.23.9", default-features = false }
rustfft = "6"
tract-linalg = { version = "=0.23.9", features = ["multithread-mm"] }
rayon = "1"
base64 = "0.22"
serde_json = "1"
libc = "0.2"

[[bin]]
name = "jarvis-whisper"
path = "src/main.rs"

[profile.release]
lto = false
codegen-units = 16
strip = "debuginfo"
