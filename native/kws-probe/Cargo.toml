[package]
name = "jarvis-kws-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "Offline experimental keyword-spotter measurements; no microphone or actions"

[features]
default = []
allocation-diagnostics = []

[dependencies]
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "=1.10.0"

[profile.release]
strip = "debuginfo"
