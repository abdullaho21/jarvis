[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-hyprland"
version = "0.2.0"
description = "Offline desktop voice controls for Windows and Hyprland"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["hyprland", "linux", "windows", "voice-control", "offline", "accessibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
dependencies = []

[project.optional-dependencies]
# PocketSphinx is the small fallback; Vosk is the default once its model is installed.
voice = ["pocketsphinx==5.1.1", "vosk==0.3.45", "sherpa-onnx==1.13.8"]
benchmark = ["psutil>=6,<8"]
windows = [
  "pywin32==312; sys_platform == 'win32'",
  "PyAudioWPatch==0.2.12.9; sys_platform == 'win32'",
  "pycaw==20260927; sys_platform == 'win32'",
  "pyvda==0.6.0; sys_platform == 'win32'",
  "screen-brightness-control==0.27.2; sys_platform == 'win32'",
  "audioop-lts==0.2.2; python_version >= '3.13' and sys_platform == 'win32'",
]

[project.scripts]
jarvis = "murmur.cli:main"
murmur = "murmur.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["murmur*"]

[tool.setuptools.package-data]
murmur = ["style.css", "onnx-cpu.conf"]
