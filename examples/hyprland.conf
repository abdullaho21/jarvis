# Optional fallback push-to-talk and immediate voice mute. Review and add manually.
# These lines do NOT get installed by Murmur. Substitute your actual path.
# This is Hyprlang syntax for releases/configurations supporting it.
# See your installed version's documentation before using Lua configuration.
bind = SUPER, V, exec, /absolute/path/to/checkout/.venv/bin/jarvis listen
bind = SUPER SHIFT, V, exec, /absolute/path/to/checkout/.venv/bin/jarvis mute

# Listen opens one bounded command session; it is not hold-to-record.
# Microphone consent and an unmuted service are required.
