# Release completed inference buffers instead of keeping a CPU memory arena.
# Model weights, graph optimizations and arithmetic remain unchanged.
EnableCpuMemArena=0
# Allocate per tensor instead of one pre-planned block: ~35 MiB lower peak
# during a command, same transcripts and decode time.
EnableMemPattern=0
# Sleeping between tasks avoids burning CPU in both Whisper session pools.
SessionConfig.session.intra_op.allow_spinning=0
SessionConfig.session.inter_op.allow_spinning=0
